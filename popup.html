<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="UTF-8">
    <title>SC汉化盒子 浏览器拓展</title>
    <style>
        /* Light mode (default) */
        :root {
            --bg-primary: #ffffff;
            --bg-secondary: #f3f4f6;
            --bg-card: #e5e7eb;
            --accent: #2563eb;
            --text-primary: #111827;
            --text-secondary: #4b5563;
            --text-muted: #9ca3af;
            --border: #d1d5db;
            --danger: #dc2626;
            --success: #16a34a;
        }

        /* Dark mode */
        @media (prefers-color-scheme: dark) {
            :root {
                --bg-primary: #1a1a2e;
                --bg-secondary: #16213e;
                --bg-card: #1f2937;
                --accent: #3b82f6;
                --text-primary: #e5e7eb;
                --text-secondary: #9ca3af;
                --text-muted: #6b7280;
                --border: #374151;
                --danger: #ef4444;
                --success: #22c55e;
            }
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: var(--bg-primary);
            color: var(--text-primary);
            width: 320px;
            font-size: 13px;
        }

        /* Header */
        .header {
            padding: 12px;
            border-bottom: 1px solid var(--border);
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .header-title {
            font-size: 14px;
            font-weight: 600;
        }

        .header-link {
            font-size: 12px;
            color: var(--accent);
            text-decoration: none;
        }

        .header-link:hover {
            text-decoration: underline;
        }

        /* User Bar - Compact */
        .user-bar {
            padding: 10px 12px;
            border-bottom: 1px solid var(--border);
            background: var(--bg-secondary);
        }

        .user-bar-content {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .user-avatar {
            width: 32px;
            height: 32px;
            border-radius: 50%;
            border: 2px solid var(--accent);
        }

        .user-info {
            flex: 1;
            min-width: 0;
        }

        .user-name {
            font-size: 13px;
            font-weight: 500;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .user-credits {
            font-size: 11px;
            color: var(--text-secondary);
        }

        .user-credits span {
            color: var(--accent);
            font-weight: 600;
        }

        .btn-small {
            padding: 4px 10px;
            font-size: 11px;
            border-radius: 4px;
            border: none;
            cursor: pointer;
            transition: opacity 0.2s;
        }

        .btn-small:hover {
            opacity: 0.8;
        }

        .btn-logout {
            background: transparent;
            color: var(--text-muted);
            border: 1px solid var(--border);
            padding: 1px 6px;
            font-size: 10px;
        }

        .btn-login {
            background: var(--accent);
            color: white;
        }

        /* Login prompt - Compact */
        .login-bar {
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .login-text {
            font-size: 12px;
            color: var(--text-secondary);
        }

        /* Loading */
        .user-loading {
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 12px;
            color: var(--text-secondary);
        }

        .spinner {
            width: 14px;
            height: 14px;
            border: 2px solid var(--border);
            border-top-color: var(--accent);
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
        }

        @keyframes spin {
            to {
                transform: rotate(360deg);
            }
        }

        /* Content */
        .content {
            padding: 12px;
        }

        .section-title {
            font-size: 11px;
            font-weight: 600;
            color: var(--text-muted);
            text-transform: uppercase;
            letter-spacing: 0.5px;
            margin-bottom: 8px;
        }

        /* Links */
        .link-list {
            display: flex;
            flex-direction: column;
            gap: 6px;
            margin-bottom: 16px;
        }

        .link-item {
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 8px 10px;
            background: var(--bg-card);
            border-radius: 6px;
            text-decoration: none;
            color: inherit;
            transition: background 0.2s;
        }

        .link-item:hover {
            background: var(--bg-secondary);
        }

        .link-icon {
            width: 24px;
            height: 24px;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
        }

        .link-icon img {
            width: 20px;
            height: 20px;
            object-fit: contain;
        }

        .link-icon svg {
            width: 18px;
            height: 18px;
        }

        .link-text {
            flex: 1;
        }

        .link-title {
            font-size: 13px;
            font-weight: 500;
        }

        .link-desc {
            font-size: 11px;
            color: var(--text-secondary);
        }

        /* Cache Section */
        .cache-section {
            background: var(--bg-card);
            border-radius: 6px;
            padding: 10px;
        }

        .cache-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 8px;
        }

        .cache-total {
            font-size: 12px;
            color: var(--text-secondary);
        }

        .cache-total strong {
            color: var(--accent);
        }

        .cache-actions {
            display: flex;
            gap: 6px;
        }

        .cache-btn {
            padding: 3px 8px;
            font-size: 11px;
            border-radius: 4px;
            border: none;
            cursor: pointer;
        }

        .cache-btn-refresh {
            background: var(--bg-secondary);
            color: var(--text-secondary);
        }

        .cache-btn-clear {
            background: rgba(239, 68, 68, 0.15);
            color: var(--danger);
        }

        .cache-list {
            max-height: 120px;
            overflow-y: auto;
        }

        .cache-item {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 4px 0;
            border-bottom: 1px solid var(--border);
            font-size: 11px;
        }

        .cache-item:last-child {
            border-bottom: none;
        }

        .cache-domain {
            flex: 1;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            color: var(--text-secondary);
        }

        .cache-count {
            margin-left: 8px;
            color: var(--text-muted);
        }

        .cache-delete {
            margin-left: 6px;
            background: none;
            border: none;
            color: var(--text-muted);
            cursor: pointer;
            padding: 2px;
        }

        .cache-delete:hover {
            color: var(--danger);
        }

        .empty-state {
            text-align: center;
            padding: 12px;
            color: var(--text-muted);
            font-size: 11px;
        }

        /* Toast */
        .toast {
            position: fixed;
            bottom: 12px;
            left: 50%;
            transform: translateX(-50%) translateY(50px);
            background: var(--bg-card);
            border: 1px solid var(--border);
            padding: 8px 16px;
            border-radius: 6px;
            font-size: 12px;
            opacity: 0;
            transition: all 0.2s;
        }

        .toast.show {
            transform: translateX(-50%) translateY(0);
            opacity: 1;
        }

        .toast.success {
            border-color: var(--success);
        }

        /* Scrollbar */
        .cache-list::-webkit-scrollbar {
            width: 4px;
        }

        .cache-list::-webkit-scrollbar-track {
            background: var(--bg-secondary);
        }

        .cache-list::-webkit-scrollbar-thumb {
            background: var(--text-muted);
            border-radius: 2px;
        }

        .hidden {
            display: none !important;
        }

        .tip-text {
            font-size: 10px;
            color: var(--text-muted);
            margin-top: 2px;
            line-height: 1.2;
        }

        .notice-box {
            padding: 10px;
            background: var(--bg-card);
            border-radius: 6px;
            font-size: 11px;
            color: var(--text-secondary);
            margin-bottom: 16px;
            line-height: 1.4;
            border-left: 3px solid var(--accent);
        }

        .notice-link {
            color: var(--accent);
            text-decoration: none;
        }

        .notice-link:hover {
            text-decoration: underline;
        }
    </style>
</head>

<body>
    <!-- Header -->
    <div class="header">
        <span class="header-title">SC汉化盒子 网页翻译 Beta</span>
        <a href="https://github.com/xkeyC/StarCitizenBoxBrowserEx" target="_blank" class="header-link">GitHub</a>
    </div>

    <!-- User Bar -->
    <div class="user-bar" id="user-section">
        <!-- Loading -->
        <div class="user-loading" id="user-loading">
            <div class="spinner"></div>
            <span>加载中...</span>
        </div>

        <div class="user-bar-content hidden" id="user-card">
            <img class="user-avatar" id="user-avatar" src="" alt="">
            <div class="user-info">
                <div class="user-name">
                    <span id="user-name">-</span>
                    <button class="btn-small btn-logout" id="logout-btn">登出</button>
                </div>
                <div class="user-credits">AI翻译额度: <span id="credits-percent">-</span></div>
                <div class="tip-text">所有翻译内容均被服务器缓存，命中缓存不消耗额度</div>
            </div>
        </div>

        <!-- Not Logged In -->
        <div class="login-bar hidden" id="login-prompt">
            <span class="login-text">登录以使用 AI 实时翻译权限</span>
            <button class="btn-small btn-login" id="login-btn">登录</button>
        </div>
    </div>

    <!-- Content -->
    <div class="content">
        <!-- Quick Links -->
        <div class="section-title">快速链接</div>
        <div class="link-list">
            <a href="https://robertsspaceindustries.com/" target="_blank" class="link-item">
                <div class="link-icon">
                    <img src="https://robertsspaceindustries.com/favicon.ico" loading="lazy" alt="">
                </div>
                <div class="link-text">
                    <div class="link-title">RSI 官网</div>
                    <div class="link-desc">罗伯茨航天工业</div>
                </div>
            </a>
            <a href="https://uexcorp.space" target="_blank" class="link-item">
                <div class="link-icon">
                    <img src="https://assets.uexcorp.space/img/logo.svg" loading="lazy" alt="">
                </div>
                <div class="link-text">
                    <div class="link-title">UEX</div>
                    <div class="link-desc">采矿、贸易、价格信息</div>
                </div>
            </a>
            <a href="https://www.erkul.games/live/calculator" target="_blank" class="link-item">
                <div class="link-icon">
                    <img src="https://www.erkul.games/assets/icons/icon-512x512.png" loading="lazy" alt="">
                </div>
                <div class="link-text">
                    <div class="link-title">DPS 计算器</div>
                    <div class="link-desc">改船、伤害数值</div>
                </div>
            </a>
            <a href="https://www.spviewer.eu/" target="_blank" class="link-item">
                <div class="link-icon">
                    <img src="https://www.spviewer.eu/favicon/favicon-32x32.png" loading="lazy" alt="">
                </div>
                <div class="link-text">
                    <div class="link-title">SPViewer</div>
                    <div class="link-desc">舰船性能、数据查询</div>
                </div>
            </a>
            <a href="https://sc-trade.tools/" target="_blank" class="link-item">
                <div class="link-icon">
                    <img src="https://sc-trade.tools/assets/icons/icon96.png" loading="lazy" alt="">
                </div>
                <div class="link-text">
                    <div class="link-title">SC Trade Tools</div>
                    <div class="link-desc">贸易线路、跑商盈利查询</div>
                </div>
            </a>
        </div>

        <div class="notice-box">
            AI 可能会出错，所有翻译内容仅供参考。更多网站正在适配中，欢迎提交<a href="https://support.citizenwiki.cn/t/sc-toolbox" target="_blank"
                class="notice-link">反馈</a>
        </div>


        <!-- Cache Section -->
        <div class="section-title">本地缓存</div>
        <div class="cache-section">
            <div class="cache-header">
                <span class="cache-total">共 <strong id="cache-total-count">-</strong> 条</span>
                <div class="cache-actions">
                    <button class="cache-btn cache-btn-refresh" id="refresh-cache-btn">刷新</button>
                    <button class="cache-btn cache-btn-clear" id="clear-all-cache-btn">清空</button>
                </div>
            </div>
            <div class="cache-list" id="cache-domains-list">
                <div class="empty-state">加载中...</div>
            </div>
        </div>
    </div>

    <div class="toast" id="toast"></div>

    <script src="popup.js"></script>
</body>

</html>
